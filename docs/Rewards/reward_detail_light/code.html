<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Reward Detail</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed": "#00201c",
                        "inverse-on-surface": "#eaf1ff",
                        "surface-container-highest": "#d9e3f6",
                        "surface-dark": "#1E1E1E",
                        "primary-container": "#10b981",
                        "outline-variant": "#bbcabf",
                        "secondary-fixed-dim": "#4fdbc8",
                        "emerald-glow": "rgba(16, 185, 129, 0.15)",
                        "on-tertiary-fixed": "#2a1700",
                        "background-warm": "#FFFFFF",
                        "surface-container-low": "#eff4ff",
                        "on-surface-variant": "#3c4a42",
                        "background": "#f8f9ff",
                        "on-error-container": "#93000a",
                        "on-primary-fixed-variant": "#005236",
                        "on-surface": "#121c2a",
                        "primary-fixed": "#6ffbbe",
                        "inverse-primary": "#4edea3",
                        "error-container": "#ffdad6",
                        "surface-container-high": "#dee9fc",
                        "on-tertiary-container": "#523200",
                        "surface-container": "#e6eeff",
                        "primary": "#006c49",
                        "on-error": "#ffffff",
                        "outline": "#6c7a71",
                        "secondary-container": "#6df5e1",
                        "on-primary-fixed": "#002113",
                        "kids-secondary": "#0D9488",
                        "on-secondary": "#ffffff",
                        "on-background": "#121c2a",
                        "error": "#ba1a1a",
                        "primary-fixed-dim": "#4edea3",
                        "secondary-fixed": "#71f8e4",
                        "kids-accent": "#D97706",
                        "surface": "#f8f9ff",
                        "surface-variant": "#d9e3f6",
                        "tertiary-fixed": "#ffddb8",
                        "kids-primary": "#059669",
                        "surface-bright": "#f8f9ff",
                        "on-secondary-fixed-variant": "#005048",
                        "secondary": "#006b5f",
                        "on-secondary-container": "#006f64",
                        "surface-tint": "#006c49",
                        "on-primary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed-variant": "#653e00",
                        "inverse-surface": "#27313f",
                        "on-primary-container": "#00422b",
                        "background-dark": "#121212",
                        "tertiary": "#855300",
                        "tertiary-container": "#e29100",
                        "on-tertiary": "#ffffff",
                        "surface-dim": "#d0dbed",
                        "tertiary-fixed-dim": "#ffb95f"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "chip-gap": "12px",
                        "button-height": "48px",
                        "base": "8px",
                        "margin-desktop": "32px",
                        "card-padding": "20px",
                        "margin-mobile": "16px"
                    },
                    "fontFamily": {
                        "headline-md": ["Inter"],
                        "body-sm": ["Inter"],
                        "headline-lg": ["Inter"],
                        "numbers-md": ["Inter"],
                        "headline-sm": ["Inter"],
                        "headline-xl": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "numbers-md": ["18px", { "lineHeight": "24px", "fontWeight": "500" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-xl": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col antialiased relative overflow-x-hidden">
<!-- Ambient Background Glow -->
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-[800px] h-[800px] bg-emerald-glow rounded-full blur-[100px] pointer-events-none opacity-50"></div>
<!-- Detail Header (Nav Suppressed due to linear/task focus) -->
<header class="flex items-center justify-between px-margin-mobile md:px-margin-desktop py-4 w-full sticky top-0 z-50 bg-surface/80 backdrop-blur-md">
<button class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors text-on-surface-variant active:scale-95">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Achievement</span>
<div class="w-12"></div> <!-- Spacer for balance -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center px-margin-mobile md:px-margin-desktop py-12 max-w-3xl mx-auto w-full relative z-10">
<!-- Hero Icon Badge -->
<div class="mb-10 relative group">
<div class="absolute inset-0 bg-primary-container rounded-full blur-xl opacity-40 group-hover:opacity-60 transition-opacity duration-500"></div>
<div class="w-40 h-40 md:w-48 md:h-48 bg-surface-container-highest border-2 border-surface-variant rounded-full flex items-center justify-center shadow-lg relative z-10 transform hover:scale-105 transition-transform duration-300">
<span class="text-7xl md:text-8xl drop-shadow-md">🎯</span>
</div>
</div>
<!-- Typography Cluster -->
<div class="text-center mb-8 space-y-3">
<h1 class="font-headline-xl text-headline-xl text-on-surface text-balance">7 Day Streak</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-md mx-auto">Amazing consistency! You're building solid foundations.</p>
</div>
<!-- Value Chip -->
<div class="mb-16">
<div class="inline-flex items-center gap-3 bg-primary-container text-on-primary-container px-6 py-3 rounded-full shadow-sm hover:bg-primary-container/90 transition-colors cursor-default">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">stars</span>
<span class="font-numbers-md text-numbers-md font-bold">+100 Points</span>
</div>
</div>
<!-- Bento Metadata Section -->
<div class="w-full grid grid-cols-1 sm:grid-cols-2 gap-4 md:gap-6">
<!-- Source Card -->
<div class="bg-surface-container-lowest p-card-padding rounded-[24px] border border-surface-variant/50 shadow-sm flex flex-col gap-2 hover:border-outline-variant transition-colors">
<div class="flex items-center gap-2 text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">checklist</span>
<span class="font-label-md text-label-md uppercase tracking-wider">Source</span>
</div>
<div class="font-headline-sm text-headline-sm text-on-surface mt-1">
                    Habit Streak
                </div>
</div>
<!-- Date Card -->
<div class="bg-surface-container-lowest p-card-padding rounded-[24px] border border-surface-variant/50 shadow-sm flex flex-col gap-2 hover:border-outline-variant transition-colors">
<div class="flex items-center gap-2 text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">calendar_today</span>
<span class="font-label-md text-label-md uppercase tracking-wider">Date</span>
</div>
<div class="font-headline-sm text-headline-sm text-on-surface mt-1">
                    August 4, 2026
                </div>
</div>
</div>
</main>
<!-- Bottom Action Area -->
<div class="px-margin-mobile md:px-margin-desktop pb-8 pt-4 w-full max-w-3xl mx-auto">
<button class="w-full h-button-height bg-primary text-on-primary font-headline-sm text-headline-sm rounded-full shadow-md hover:shadow-lg hover:-translate-y-0.5 active:translate-y-0 active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2">
<span class="material-symbols-outlined">ios_share</span>
            Share Milestone
        </button>
</div>
</body></html>
