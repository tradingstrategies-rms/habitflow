            0%, 100% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }

<div class="w-10 h-10 rounded-full overflow-hidden bg-surface-container-high border-2 border-kids-primary/30 flex-shrink-0 cursor-pointer active:scale-95 transition-transform">

<!-- Decorative soft shapes -->
<div class="absolute -top-10 -left-10 w-32 h-32 bg-kids-primary/5 rounded-full blur-xl"></div>
<div class="absolute -bottom-10 -right-10 w-40 h-40 bg-kids-secondary/5 rounded-full blur-xl"></div>

<div class="font-headline-xl text-[48px] leading-[56px] font-extrabold text-kids-primary tracking-tight mb-6 z-10 drop-shadow-sm">
                350 Stars
            </div>
<!-- Level Badge (Kids Theme: Circular, thick squishy border) -->
<div class="z-10 inline-flex items-center gap-3 bg-surface-container-lowest px-5 py-3 squishy-border border-4 border-kids-accent/20 shadow-sm">
<span class="material-symbols-outlined text-kids-accent text-[28px]" style="font-variation-settings: 'FILL' 1;">workspace_premium</span>
<span class="font-headline-sm text-headline-sm text-on-surface">Super Learner</span>
</div>

</div>
