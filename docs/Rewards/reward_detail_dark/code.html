<body class="antialiased min-h-screen flex flex-col items-center justify-center p-4">
<!-- Top Navigation (Suppressed for focused detail view) -->
<main class="w-full max-w-md w-full relative">

</button>

<!-- Subtle background texture/gradient -->
<div class="absolute inset-0 bg-gradient-to-br from-primary/10 to-transparent opacity-50 z-0"></div>
<div class="relative z-10 flex flex-col items-center text-center space-y-6">

<div class="w-24 h-24 rounded-full bg-surface-dark border-2 border-primary-container flex items-center justify-center shadow-[0_0_20px_rgba(16,185,129,0.3)] mb-4">
<span aria-hidden="true" class="text-6xl">🎯</span>
</div>
<!-- Title & Source -->

<h1 class="font-headline-xl text-headline-xl text-white">7 Day Streak</h1>
<p class="font-body-lg text-body-lg text-outline-variant">Habit Streak Reward</p>
</div>

<span class="material-symbols-outlined text-primary-container" style="font-size: 32px; font-variation-settings: 'FILL' 1;">stars</span>

</div>

<p class="font-label-md text-label-md text-outline-variant uppercase tracking-wider">Date Earned</p>
