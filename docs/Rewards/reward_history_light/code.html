<body class="bg-surface text-on-surface min-h-screen pb-24">
<!-- TopAppBar -->
<header class="w-full sticky top-0 z-40 bg-surface text-primary flat no shadows flex items-center justify-between px-margin-mobile md:px-margin-desktop py-4 w-full">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A portrait photo of a smiling person, warmly lit in a clean modern environment, serving as a user profile avatar." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDJ3YcBWHcvSEfYYHNpywsW4mGwGi7SO1BGsv7VDdiJtDKwrWmE2b8QIV6n8kE01CjtXTiUm2dxZizUIEBe8Kigc6oBLaDMDudQtWjmex5YeOD6opCLvEhI2xGp8DuB5D6E1v9IkjxYf-0eW1COn_BOxOc4sZyFxnWLVOMGH4DMWRe__sjktnZkj44WJjvhE0DpfUwzUCFFGXXlLFrNfiANxy4Rfw618jVGWxkv3hbipO17qmwlZ-FC"/>
</div>
<h1 class="font-headline-md text-headline-md font-bold text-primary">Rewards</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full text-primary hover:opacity-80 transition-opacity active:scale-95 transition-transform">
<span class="material-symbols-outlined">settings</span>
</button>
</header>
<main class="px-margin-mobile md:px-margin-desktop max-w-4xl mx-auto pt-8 flex flex-col gap-8">
<!-- Filter Chips -->
<section class="w-full overflow-x-auto pb-4 hide-scrollbar">
<div class="flex gap-chip-gap w-max">
<button class="h-10 px-6 rounded-full bg-primary-container text-on-primary-container font-label-md text-label-md hover:opacity-90 transition-opacity">All</button>
<button class="h-10 px-6 rounded-full bg-surface-container border border-outline-variant text-on-surface-variant font-label-md text-label-md hover:bg-surface-container-high transition-colors">Habits</button>
<button class="h-10 px-6 rounded-full bg-surface-container border border-outline-variant text-on-surface-variant font-label-md text-label-md hover:bg-surface-container-high transition-colors">Goals</button>
<button class="h-10 px-6 rounded-full bg-surface-container border border-outline-variant text-on-surface-variant font-label-md text-label-md hover:bg-surface-container-high transition-colors">Achievements</button>
<button class="h-10 px-6 rounded-full bg-surface-container border border-outline-variant text-on-surface-variant font-label-md text-label-md hover:bg-surface-container-high transition-colors">Family</button>
</div>
</section>
<!-- Timeline Section: Today -->
<section class="flex flex-col gap-6">
<h2 class="font-headline-sm text-headline-sm text-on-surface-variant">Today</h2>
<div class="relative pl-6 before:absolute before:left-0 before:top-2 before:bottom-0 before:w-px before:bg-surface-container-high before:z-0 flex flex-col gap-8">
<!-- Transaction Item -->
<div class="relative flex items-center justify-between z-10 group">
<div class="absolute -left-6 w-px h-full bg-primary opacity-0 group-hover:opacity-100 transition-opacity"></div>
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-primary-container/20 flex items-center justify-center -ml-[30px] shadow-sm z-20">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
<div class="flex flex-col">
<span class="font-body-lg text-body-lg text-on-surface">Morning Exercise</span>
<span class="font-label-md text-label-md text-on-surface-variant">08:00 AM • Habit</span>
</div>
</div>
<span class="font-numbers-md text-numbers-md text-primary">+10</span>
</div>
<!-- Transaction Item -->
<div class="relative flex items-center justify-between z-10 group">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center -ml-[30px] border border-surface-container-highest z-20">
<span class="material-symbols-outlined text-on-surface-variant">water_drop</span>
</div>
<div class="flex flex-col">
<span class="font-body-lg text-body-lg text-on-surface">Drink Water</span>
<span class="font-label-md text-label-md text-on-surface-variant">10:30 AM • Habit</span>
</div>
</div>
<span class="font-numbers-md text-numbers-md text-primary">+5</span>
</div>
</div>
</section>
<!-- Timeline Section: This Week -->
<section class="flex flex-col gap-6 pt-4">
<h2 class="font-headline-sm text-headline-sm text-on-surface-variant">This Week</h2>
<div class="relative pl-6 before:absolute before:left-0 before:top-2 before:bottom-0 before:w-px before:bg-surface-container-high before:z-0 flex flex-col gap-8">
<!-- Transaction Item (Goal) -->
<div class="relative flex items-center justify-between z-10">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-lg bg-secondary-container/30 flex items-center justify-center -ml-[30px] z-20 shadow-sm backdrop-blur-sm border border-secondary-container/50">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">emoji_events</span>
</div>
<div class="flex flex-col">
<span class="font-body-lg text-body-lg text-on-surface">Read 3 Books</span>
<span class="font-label-md text-label-md text-on-surface-variant">Mon, 14th • Goal Reached</span>
</div>
</div>
<span class="font-numbers-md text-numbers-md text-primary">+50</span>
</div>
<!-- Transaction Item (Spent) -->
<div class="relative flex items-center justify-between z-10">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-error-container/20 flex items-center justify-center -ml-[30px] z-20">
<span class="material-symbols-outlined text-error">shopping_bag</span>
</div>
<div class="flex flex-col">
<span class="font-body-lg text-body-lg text-on-surface">Movie Night Ticket</span>
<span class="font-label-md text-label-md text-on-surface-variant">Sun, 13th • Redeemed</span>
</div>
</div>
<span class="font-numbers-md text-numbers-md text-on-surface-variant">-150</span>
</div>
<!-- Transaction Item -->
<div class="relative flex items-center justify-between z-10">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-primary-container/20 flex items-center justify-center -ml-[30px] z-20 shadow-sm">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
<div class="flex flex-col">
<span class="font-body-lg text-body-lg text-on-surface">Clean Room</span>
<span class="font-label-md text-label-md text-on-surface-variant">Sat, 12th • Family Task</span>
</div>
</div>
<span class="font-numbers-md text-numbers-md text-primary">+20</span>
</div>
</div>
</section>
