<script>
        const themeSelector = document.getElementById('themeSelector');
        const body = document.body;
        const html = document.documentElement;

        themeSelector.addEventListener('change', (e) => {
            const theme = e.target.value;
            
            // Remove previous classes
            html.classList.remove('dark');
            body.classList.remove('bg-background', 'bg-background-dark');
            
            if (theme === 'dark') {
                html.classList.add('dark');
                body.classList.add('bg-background-dark');
            } else if (theme === 'light') {
                body.classList.add('bg-background');
            } else if (theme === 'kids') {
                body.classList.add('bg-background');
                // Subtle feedback or animation could go here
            }
        });

        // Micro-interaction for cards
        const themeCards = document.querySelectorAll('label > div');
        themeCards.forEach(card => {
            card.addEventListener('click', () => {
                card.style.transform = 'scale(0.98)';
                setTimeout(() => {
                    card.style.transform = 'scale(1)';
                }, 100);
            });
        });
    </script>
