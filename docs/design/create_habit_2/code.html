<body class="bg-background text-on-background min-h-screen flex flex-col">

<button class="material-symbols-outlined text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 transition-transform" data-icon="arrow_back">

</div>
<button class="text-on-surface-variant/40 font-semibold px-4 py-2 pointer-events-none" disabled="">

</header>
<!-- Content Area -->
<main class="flex-1 overflow-y-auto px-margin-mobile pb-32 space-y-8 pt-4">
<!-- Habit Name Section -->
<section class="space-y-2">
<label class="font-label-sm text-label-sm text-outline uppercase tracking-widest ml-1">Habit Name</label>

<input class="w-full bg-white border-2 border-outline-variant rounded-2xl p-card-padding text-body-lg font-body-lg focus:border-primary focus:ring-0 transition-all placeholder:text-outline-variant" placeholder="What habit would you like to build?" type="text"/>

</section>
<!-- Description Section -->

<label class="font-label-sm text-label-sm text-outline uppercase tracking-widest ml-1">Description (Optional)</label>
<textarea class="w-full bg-white border-2 border-outline-variant rounded-2xl p-card-padding text-body-lg font-body-lg focus:border-primary focus:ring-0 transition-all placeholder:text-outline-variant resize-none" placeholder="Add some context or motivation..." rows="3"></textarea>
</section>
<!-- Category Section -->
<section class="space-y-3">
<label class="font-label-sm text-label-sm text-outline uppercase tracking-widest ml-1">Category</label>
<div class="flex gap-2 overflow-x-auto hide-scrollbar -mx-margin-mobile px-margin-mobile">
<button class="whitespace-nowrap px-chip-padding py-2 rounded-full border-1.5 border-outline-variant bg-primary text-on-primary font-medium transition-all active:scale-95">Health</button>
<button class="whitespace-nowrap px-chip-padding py-2 rounded-full border-1.5 border-outline-variant bg-surface text-on-surface-variant font-medium hover:bg-surface-variant/50 transition-all active:scale-95">Fitness</button>
<button class="whitespace-nowrap px-chip-padding py-2 rounded-full border-1.5 border-outline-variant bg-surface text-on-surface-variant font-medium hover:bg-surface-variant/50 transition-all active:scale-95">Mindfulness</button>
<button class="whitespace-nowrap px-chip-padding py-2 rounded-full border-1.5 border-outline-variant bg-surface text-on-surface-variant font-medium hover:bg-surface-variant/50 transition-all active:scale-95">Learning</button>
<button class="whitespace-nowrap px-chip-padding py-2 rounded-full border-1.5 border-outline-variant bg-surface text-on-surface-variant font-medium hover:bg-surface-variant/50 transition-all active:scale-95">Productivity</button>
<button class="whitespace-nowrap px-chip-padding py-2 rounded-full border-1.5 border-outline-variant bg-surface text-on-surface-variant font-medium hover:bg-surface-variant/50 transition-all active:scale-95">Finance</button>
</div>
</section>
<!-- Frequency Section -->

<label class="font-label-sm text-label-sm text-outline uppercase tracking-widest ml-1">Frequency</label>
<div class="segmented-control-bg flex w-full">
<button class="flex-1 py-2 active-segment rounded-full font-medium text-primary text-sm transition-all duration-200">Daily</button>
<button class="flex-1 py-2 text-on-surface-variant font-medium text-sm transition-all duration-200">Weekly</button>

            Create Habit

<script>
        // Simple Interaction logic for demo
        document.querySelectorAll('button:not([disabled])').forEach(btn => {
            btn.addEventListener('click', (e) => {
                // Visual feedback only for demo
                const isSegment = e.target.parentElement.classList.contains('segmented-control-bg');
                if(isSegment) {
                    e.target.parentElement.querySelectorAll('button').forEach(b => {
                        b.classList.remove('active-segment', 'text-primary');
                        b.classList.add('text-on-surface-variant');
                    });
                    e.target.classList.add('active-segment', 'text-primary');
                    e.target.classList.remove('text-on-surface-variant');
                }
            });
        });

        // Input validation listener to enable button (simplified)
        const nameInput = document.querySelector('input[type="text"]');
        const submitBtn = document.querySelector('.fixed button');
        const saveBtn = document.querySelector('header button:last-child');

        nameInput.addEventListener('input', (e) => {
            if(e.target.value.trim().length > 0) {
                submitBtn.classList.remove('bg-outline-variant', 'opacity-50', 'cursor-not-allowed');
                submitBtn.classList.add('bg-primary');
                submitBtn.disabled = false;
                
                saveBtn.classList.remove('text-on-surface-variant/40', 'pointer-events-none');
                saveBtn.classList.add('text-primary');
                saveBtn.disabled = false;
            } else {
                submitBtn.classList.add('bg-outline-variant', 'opacity-50', 'cursor-not-allowed');
                submitBtn.classList.remove('bg-primary');
                submitBtn.disabled = true;

                saveBtn.classList.add('text-on-surface-variant/40', 'pointer-events-none');
                saveBtn.classList.remove('text-primary');
                saveBtn.disabled = true;
            }
        });
    </script>
