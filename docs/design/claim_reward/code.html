<style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .reward-confetti {
            position: fixed;
            pointer-events: none;
            width: 10px;
            height: 10px;
            background-color: #00D991;
            z-index: 100;
        }
        @keyframes fall {
            to { transform: translateY(100vh) rotate(360deg); }
        }
        .glass-panel {
            backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.85);
        }
        .organic-float {
            animation: floating 3s ease-in-out infinite;
        }
        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }

<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center">
<!-- Background Canvas for the main app view (underlay) -->
<div class="fixed inset-0 z-0 bg-surface-container-low opacity-40">
<div class="grid grid-cols-2 p-margin-mobile gap-base opacity-20 pointer-events-none">
<div class="h-32 bg-surface-variant rounded-xl"></div>
<div class="h-32 bg-surface-variant rounded-xl"></div>
<div class="h-48 bg-surface-variant rounded-xl col-span-2"></div>
<div class="h-32 bg-surface-variant rounded-xl"></div>
<div class="h-32 bg-surface-variant rounded-xl"></div>
</div>
</div>
<!-- Scrim / Overlay -->
<div class="fixed inset-0 bg-on-background/40 backdrop-blur-sm z-40 transition-opacity duration-300" id="scrim"></div>
<!-- Dialog Container -->
<div class="relative z-50 w-full max-w-[340px] md:max-w-[400px] mx-margin-mobile">
<div class="bg-surface rounded-[32px] p-8 shadow-2xl flex flex-col items-center text-center border border-white/20">
<!-- Reward Illustration -->
<div class="relative mb-6">
<div class="absolute inset-0 bg-secondary-container/30 rounded-full blur-2xl scale-150 organic-float"></div>
<div class="relative bg-secondary-container/20 p-6 rounded-full organic-float">
<span class="material-symbols-outlined text-[80px] text-primary" style="font-variation-settings: 'FILL' 1;">icecream</span>
</div>
<!-- Mini Floating Stars -->
<div class="absolute -top-2 -right-2 bg-kids-accent p-2 rounded-full shadow-lg">
<span class="material-symbols-outlined text-white text-sm" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
<div class="absolute bottom-4 -left-4 bg-primary p-2 rounded-full shadow-lg">
<span class="material-symbols-outlined text-white text-sm" style="font-variation-settings: 'FILL' 1;">celebration</span>
</div>
</div>
<!-- Content -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-2 tracking-tight">
                You've earned an Ice Cream Trip!
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-8 px-4">
                Amazing work! Your consistency is paying off. Time to celebrate with something sweet.
            </p>
<!-- Star Deduction Indicator -->
<div class="bg-surface-container-low rounded-2xl p-4 w-full mb-8 flex items-center justify-center gap-3">
<div class="flex items-center gap-1.5 text-on-surface font-body-numbers text-body-numbers">
<span class="material-symbols-outlined text-kids-accent" style="font-variation-settings: 'FILL' 1;">star</span>
<span>2,450</span>
</div>
<div class="h-4 w-[1px] bg-outline-variant"></div>
<div class="flex items-center gap-1.5 text-danger font-body-numbers text-body-numbers">
<span class="material-symbols-outlined text-danger">trending_down</span>
<span>-200 Stars</span>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col w-full gap-3">
<button class="bg-primary text-on-primary font-headline-sm text-headline-sm h-touch-target-min rounded-2xl shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-95 transition-all duration-200 flex items-center justify-center" id="redeemBtn">
                    Redeem Now
                </button>
<button class="text-on-surface-variant font-label-sm text-label-sm h-touch-target-min hover:bg-surface-container-low rounded-2xl transition-colors" id="cancelBtn">
                    Save for later
                </button>
</div>
</div>
<!-- Decorative Card Elements -->
<div class="absolute -bottom-4 -right-4 -z-10 w-24 h-24 bg-primary/10 rounded-3xl rotate-12"></div>
<div class="absolute -top-4 -left-4 -z-10 w-16 h-16 bg-secondary-container/30 rounded-full"></div>
</div>
<!-- Confetti Logic -->
<script>
        function createConfetti() {
            const colors = ['#00D991', '#FFC107', '#006c49', '#6df5e1', '#F97316'];
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('reward-confetti');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0%';
                confetti.style.animation = `fall ${Math.random() * 3 + 2}s linear forwards`;
                confetti.style.opacity = Math.random();
                confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                document.body.appendChild(confetti);
                
                setTimeout(() => {
                    confetti.remove();
                }, 5000);
            }
        }

        // Trigger confetti on load for celebratory feel
        window.addEventListener('load', () => {
            setTimeout(createConfetti, 300);
        });

        const redeemBtn = document.getElementById('redeemBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const scrim = document.getElementById('scrim');

        redeemBtn.addEventListener('click', () => {
            redeemBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
            createConfetti();
            setTimeout(() => {
                alert('Reward Redeemed! Check your digital voucher in the Rewards tab.');
                redeemBtn.innerHTML = 'Redeem Now';
            }, 1000);
        });

        [cancelBtn, scrim].forEach(el => {
            el.addEventListener('click', () => {
                document.body.style.opacity = '0';
                setTimeout(() => {
                    window.location.reload(); // Simple reset for demo
                }, 300);
            });
        });
    </script>
