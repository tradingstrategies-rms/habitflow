<style>
        body {

        .avatar-card.selected {

        }
        .avatar-card.selected .check-badge {

<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- Top Navigation Shell (Transactional Suppression: No BottomNav/FAB for this focused flow) -->
<header class="bg-background dark:bg-background-dark docked full-width top-0 sticky z-30">
<div class="flex items-center justify-between px-margin-mobile h-touch-target-min w-full max-w-7xl mx-auto">
<button class="text-primary dark:text-primary-fixed-dim hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors rounded-full w-10 h-10 flex items-center justify-center active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="font-headline-sm text-headline-sm font-bold text-primary dark:text-primary-fixed-dim">
                HabitFlow
            </div>
<div class="w-10"></div> <!-- Spacer for symmetry -->
</div>
</header>
<main class="flex-grow flex flex-col items-center px-margin-mobile py-8 max-w-4xl mx-auto w-full">
<!-- Progress Indicator -->
<div class="flex gap-2 mb-8">
<div class="h-1.5 w-8 rounded-full bg-primary"></div>

</div>

<button class="px-chip-padding py-2 rounded-full bg-surface-container text-on-surface-variant font-label-sm hover:bg-surface-container-high transition-all">Child</button>
<button class="px-chip-padding py-2 rounded-full bg-surface-container text-on-surface-variant font-label-sm hover:bg-surface-container-high transition-all">Guardian</button>
<button class="px-chip-padding py-2 rounded-full bg-surface-container text-on-surface-variant font-label-sm hover:bg-surface-container-high transition-all">Other</button>
</div><section class="text-center mb-10">
<h1 class="font-headline-xl-mobile md:font-headline-xl text-headline-xl-mobile md:text-headline-xl text-on-surface mb-3">Choose an Avatar</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Pick the character that best represents you today.</p>
</section><div class="flex overflow-x-auto no-scrollbar gap-6 w-full mb-8 border-b border-outline-variant">
<button class="pb-3 border-b-2 border-primary text-primary font-label-sm whitespace-nowrap">Adults</button>
<button class="pb-3 border-b-2 border-transparent text-on-surface-variant font-label-sm whitespace-nowrap hover:text-primary transition-colors">Kids</button>
<button class="pb-3 border-b-2 border-transparent text-on-surface-variant font-label-sm whitespace-nowrap hover:text-primary transition-colors">Animals</button>
<button class="pb-3 border-b-2 border-transparent text-on-surface-variant font-label-sm whitespace-nowrap hover:text-primary transition-colors">Nature</button>
<button class="pb-3 border-b-2 border-transparent text-on-surface-variant font-label-sm whitespace-nowrap hover:text-primary transition-colors">Fantasy</button>
</div>
<!-- Avatar Bento Grid -->
<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-6 w-full mb-12" id="avatar-grid"><!-- Adult Avatar -->
<button class="avatar-card relative group flex flex-col items-center p-2 rounded-3xl border-4 border-transparent bg-surface shadow-sm transition-all duration-300 hover:shadow-md active:scale-95" onclick="selectAvatar(this)">
<div class="aspect-square w-full rounded-2xl overflow-hidden bg-surface-container-low mb-3 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-6xl">person</span>
</div>
<div class="absolute top-3 right-3 check-badge opacity-0 scale-50 transition-all duration-300 bg-primary text-white rounded-full w-8 h-8 flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'wght' 700;">check</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant group-hover:text-primary transition-colors">The Mentor</span>
</button>
<!-- Animal Avatar -->

<span class="material-symbols-outlined text-primary text-6xl">pets</span>

<div class="absolute top-3 right-3 check-badge opacity-0 scale-50 transition-all duration-300 bg-primary text-white rounded-full w-8 h-8 flex items-center justify-center shadow-lg">

</div>
<span class="font-label-sm text-label-sm text-on-surface-variant group-hover:text-primary transition-colors">The Companion</span>
</button>
<!-- Nature Avatar -->
<button class="avatar-card relative group flex flex-col items-center p-2 rounded-3xl border-4 border-transparent bg-surface shadow-sm transition-all duration-300 hover:shadow-md active:scale-95" onclick="selectAvatar(this)">
<div class="aspect-square w-full rounded-2xl overflow-hidden bg-surface-container-low mb-3 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-6xl">eco</span>
</div>
<div class="absolute top-3 right-3 check-badge opacity-0 scale-50 transition-all duration-300 bg-primary text-white rounded-full w-8 h-8 flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'wght' 700;">check</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant group-hover:text-primary transition-colors">The Leaf</span>
</button>
<!-- Fantasy Avatar -->
<button class="avatar-card relative group flex flex-col items-center p-2 rounded-3xl border-4 border-transparent bg-surface shadow-sm transition-all duration-300 hover:shadow-md active:scale-95" onclick="selectAvatar(this)">
<div class="aspect-square w-full rounded-2xl overflow-hidden bg-surface-container-low mb-3 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-6xl">auto_awesome</span>
</div>
<div class="absolute top-3 right-3 check-badge opacity-0 scale-50 transition-all duration-300 bg-primary text-white rounded-full w-8 h-8 flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'wght' 700;">check</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant group-hover:text-primary transition-colors">The Mystic</span>
</button>
<!-- Nature Avatar 2 -->
<button class="avatar-card relative group flex flex-col items-center p-2 rounded-3xl border-4 border-transparent bg-surface shadow-sm transition-all duration-300 hover:shadow-md active:scale-95" onclick="selectAvatar(this)">
<div class="aspect-square w-full rounded-2xl overflow-hidden bg-surface-container-low mb-3 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-6xl">wb_sunny</span>
</div>
<div class="absolute top-3 right-3 check-badge opacity-0 scale-50 transition-all duration-300 bg-primary text-white rounded-full w-8 h-8 flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'wght' 700;">check</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant group-hover:text-primary transition-colors">The Sun</span>
</button>
<!-- Fantasy Avatar 2 -->
<button class="avatar-card relative group flex flex-col items-center p-2 rounded-3xl border-4 border-transparent bg-surface shadow-sm transition-all duration-300 hover:shadow-md active:scale-95" onclick="selectAvatar(this)">
<div class="aspect-square w-full rounded-2xl overflow-hidden bg-surface-container-low mb-3 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-6xl">star</span>
</div>
<div class="absolute top-3 right-3 check-badge opacity-0 scale-50 transition-all duration-300 bg-primary text-white rounded-full w-8 h-8 flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'wght' 700;">check</span>
</div>

</button></div>
<!-- Sticky Bottom Action -->
<div class="w-full max-w-md mt-auto">
<button class="w-full py-4 px-6 bg-primary-container text-on-primary-container rounded-full font-headline-sm text-headline-sm flex items-center justify-center gap-2 transition-all duration-200 opacity-50 cursor-not-allowed active:scale-95 hover:shadow-lg" disabled="" id="next-button">
                Next
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</main>
<!-- Background Decorative Elements -->
<div class="fixed top-0 right-0 -z-10 w-64 h-64 bg-primary/5 rounded-full blur-3xl opacity-50 -mr-32 -mt-32 pointer-events-none"></div>
<div class="fixed bottom-0 left-0 -z-10 w-96 h-96 bg-secondary/5 rounded-full blur-3xl opacity-30 -ml-48 -mb-48 pointer-events-none"></div>
<script>
        function selectAvatar(element) {
            // Remove selection from all cards
            document.querySelectorAll('.avatar-card').forEach(card => {
                card.classList.remove('selected');
            });
            
            // Add selection to clicked card
            element.classList.add('selected');
            
            // Enable next button
            const nextBtn = document.getElementById('next-button');
            nextBtn.disabled = false;
            nextBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            nextBtn.classList.add('bg-primary', 'text-white');
            
            // Subtle haptic feel through animation
            element.classList.add('scale-105');
            setTimeout(() => {
                element.classList.remove('scale-105');
            }, 150);
        }

        // Add a subtle entrance animation to the grid items
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.avatar-card');
            cards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    card.style.transition = 'all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1)';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, 100 * index);
            });
        });
    </script>
