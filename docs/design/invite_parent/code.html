<main class="flex-1 w-full max-w-md px-margin-mobile pt-8 pb-12 overflow-y-auto">

<!-- Asymmetric Bento-style Layout -->

</div>
<div>

<!-- Bottom Navigation Shell (Suppressed for focus journey, but keeping structural placeholder if needed) -->
<!-- Navigation is suppressed per "Task-Focused" rule in Shell Visibility & Relevance -->
<script>
        // Micro-interaction for the Share Link button
        const shareBtn = document.querySelector('button.group.relative');
        shareBtn.addEventListener('click', () => {
            // Check if Web Share API is available
            if (navigator.share) {
                navigator.share({
                    title: 'Join HabitFlow',
                    text: 'Join my family on HabitFlow to start building healthy habits together!',
                    url: 'https://habitflow.app/invite/family-123'
                }).then(() => {
                    console.log('Successful share');
                }).catch((error) => {
                    console.log('Error sharing', error);
                });
            } else {
                // Fallback: Copy to clipboard
                const dummy = document.createElement('input');
                document.body.appendChild(dummy);
                dummy.value = 'https://habitflow.app/invite/family-123';
                dummy.select();
                document.execCommand('copy');
                document.body.removeChild(dummy);
                
                // Simple Visual Feedback
                const originalText = shareBtn.querySelector('h3').innerText;
                shareBtn.querySelector('h3').innerText = 'Link Copied!';
                setTimeout(() => {
                    shareBtn.querySelector('h3').innerText = originalText;
                }, 2000);
            }
        });

        // Email form interaction
        const inviteBtn = document.querySelector('button.bg-primary');
        const emailInput = document.querySelector('#email');
        
        inviteBtn.addEventListener('click', () => {
            if (emailInput.value && emailInput.value.includes('@')) {
                inviteBtn.innerHTML = `
                    <span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span>
                    <span>Sending...</span>
                `;
                setTimeout(() => {
                    inviteBtn.classList.remove('bg-primary');
                    inviteBtn.classList.add('bg-success');
                    inviteBtn.innerHTML = `
                        <span class="material-symbols-outlined" data-icon="check_circle">check_circle</span>
                        <span>Invite Sent!</span>
                    `;
                    emailInput.value = '';
                }, 1500);
            } else {
                emailInput.classList.add('border-error');
                setTimeout(() => emailInput.classList.remove('border-error'), 2000);
            }
        });
    </script>
