<script>
        // Simple micro-interaction for Approval
        const approveBtn = document.getElementById('approveBtn');
        const confettiCanvas = document.getElementById('confetti');
        
        approveBtn.addEventListener('click', () => {
            approveBtn.innerHTML = 'Approved! 🎉';
            approveBtn.classList.replace('bg-primary-container', 'bg-success');
            
            // Simple visual feedback trigger
            startConfetti();
            
            setTimeout(() => {
                // Navigate back or reset (mock behavior)
                alert('Reward granted to Leo! Redirecting...');
            }, 1500);
        });

        // Basic Confetti Effect
        function startConfetti() {
            const ctx = confettiCanvas.getContext('2d');
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
            
            let particles = [];
            for (let i = 0; i < 100; i++) {
                particles.push({
                    x: Math.random() * confettiCanvas.width,
                    y: confettiCanvas.height + Math.random() * 20,
                    r: Math.random() * 6 + 4,
                    d: Math.random() * 10,
                    color: `hsl(${Math.random() * 360}, 70%, 60%)`,
                    tilt: Math.random() * 10 - 10,
                    tiltAngleIncremental: Math.random() * 0.07 + 0.05,
                    tiltAngle: 0
                });
            }

            function draw() {
                ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
                particles.forEach((p, i) => {
                    p.tiltAngle += p.tiltAngleIncremental;
                    p.y -= (Math.cos(p.d) + 3 + p.r / 2) / 2;
                    p.x += Math.sin(p.d);
                    p.tilt = Math.sin(p.tiltAngle) * 15;

                    ctx.beginPath();
                    ctx.lineWidth = p.r;
                    ctx.strokeStyle = p.color;
                    ctx.moveTo(p.x + p.tilt + p.r / 2, p.y);
                    ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 2);
                    ctx.stroke();
                });
                
                if (particles[0].y > -100) {
                    requestAnimationFrame(draw);
                }
            }
            draw();
        }
    </script>
