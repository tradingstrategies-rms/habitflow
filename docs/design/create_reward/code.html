<script>
        // Micro-interactions and form handling
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.querySelector('form');
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                // Add a small success haptic/visual feedback
                const submitBtn = e.target.querySelector('button[type="submit"]');
                const originalText = submitBtn.innerHTML;
                submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Saving...';
                submitBtn.disabled = true;
                
                setTimeout(() => {
                    submitBtn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Saved!';
                    submitBtn.classList.replace('bg-primary', 'bg-success');
                    setTimeout(() => {
                        submitBtn.innerHTML = originalText;
                        submitBtn.classList.replace('bg-success', 'bg-primary');
                        submitBtn.disabled = false;
                    }, 2000);
                }, 1200);
            });

            // Handle Category Selection
            const catButtons = document.querySelectorAll('.grid > div:last-child button');
            catButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    catButtons.forEach(b => {
                        b.classList.remove('bg-primary-container', 'text-on-primary-container', 'border-primary');
                        b.classList.add('border-outline-variant');
                    });
                    btn.classList.add('bg-primary-container', 'text-on-primary-container', 'border-primary');
                    btn.classList.remove('border-outline-variant');
                });
            });
        });
    </script>
