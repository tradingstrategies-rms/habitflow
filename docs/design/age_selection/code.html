<style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .age-chip-active {
            @apply bg-primary text-on-primary ring-4 ring-primary-container/30 scale-110;
        }

        /* Subtle atmospheric background effect */
        .ambient-glow {
            position: fixed;
            top: -10%;
            right: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.05) 0%, rgba(250, 249, 248, 0) 70%);
            z-index: -1;
            pointer-events: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<div class="ambient-glow"></div>
<!-- TopAppBar -->
<header class="bg-background dark:bg-background-dark font-headline-sm text-headline-sm docked full-width top-0 z-50">
<div class="flex items-center justify-between px-margin-mobile h-touch-target-min w-full max-w-7xl mx-auto">
<button class="text-primary dark:text-primary-fixed-dim hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors p-2 rounded-full active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim">HabitFlow</h1>
<div class="w-10"></div> <!-- Spacer for balance -->
</div>
</header>
<!-- Main Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile pt-8 pb-24 max-w-lg mx-auto w-full">
<!-- Illustration / Decor (Organic Vitality) -->
<div class="mb-10 opacity-80">
<div class="w-32 h-32 rounded-full bg-primary-container flex items-center justify-center relative overflow-hidden">
<div class="absolute inset-0 opacity-20">

</div>
<span class="material-symbols-outlined text-6xl text-on-primary-container" style="font-variation-settings: 'FILL' 1;">cake</span>
</div>
</div>
<!-- Headline Area -->
<div class="text-center mb-12">
<h2 class="font-headline-xl-mobile text-headline-xl-mobile text-on-surface mb-3">How old is Leo?</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-xs mx-auto">
                Setting the age helps us suggest the best habits and rewards for their development.
            </p>
</div>
<!-- Age Selector - Horizontal Scroller with Large Chips -->
<div class="w-full relative">
<!-- Fade Indicators -->
<div class="absolute left-0 top-0 bottom-0 w-12 bg-gradient-to-r from-background to-transparent z-10 pointer-events-none"></div>
<div class="absolute right-0 top-0 bottom-0 w-12 bg-gradient-to-l from-background to-transparent z-10 pointer-events-none"></div>
<div class="flex overflow-x-auto hide-scrollbar gap-4 px-12 py-6 snap-x snap-mandatory items-center" id="age-scroller">
<!-- Age Cards 1-18+ -->
<script>
                    const scroller = document.currentScript.parentElement;
                    const ages = Array.from({length: 17}, (_, i) => i + 1).concat("18+");
                    const defaultAge = 7;

                    ages.forEach(age => {
                        const btn = document.createElement('button');
                        btn.className = `flex-shrink-0 w-20 h-24 rounded-2xl bg-surface-container flex flex-col items-center justify-center snap-center transition-all duration-300 active:scale-90 border-2 border-transparent`;
                        btn.dataset.age = age;
                        btn.onclick = () => selectAge(age);
                        
                        if(age == defaultAge) {
                            btn.classList.add('ring-4', 'ring-primary-container/40', 'bg-primary', 'text-on-primary', 'scale-110');
                        } else {
                            btn.classList.add('text-on-surface-variant', 'hover:bg-surface-container-high');
                        }

                        btn.innerHTML = `
                            <span class="font-headline-md text-headline-md font-bold">${age}</span>
                            <span class="font-label-sm text-label-sm opacity-70">${age === "18+" ? 'Adult' : 'Years'}</span>
                        `;
                        scroller.appendChild(btn);
                    });

                    function selectAge(age) {
                        const buttons = document.querySelectorAll('#age-scroller button');
                        buttons.forEach(b => {
                            b.classList.remove('ring-4', 'ring-primary-container/40', 'bg-primary', 'text-on-primary', 'scale-110');
                            b.classList.add('text-on-surface-variant', 'bg-surface-container');
                        });
                        const selected = Array.from(buttons).find(b => b.dataset.age == age);
                        selected.classList.remove('text-on-surface-variant', 'bg-surface-container');
                        selected.classList.add('ring-4', 'ring-primary-container/40', 'bg-primary', 'text-on-primary', 'scale-110');
                        
                        // Center selected element
                        selected.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                        
                        // Update feedback
                        document.getElementById('age-display').innerText = `Leo is ${age} years old`;
                    }
                    
                    // Initial scroll to default
                    window.onload = () => {
                        const defaultBtn = Array.from(document.querySelectorAll('#age-scroller button')).find(b => b.dataset.age == defaultAge);
                        defaultBtn.scrollIntoView({ behavior: 'auto', inline: 'center' });
                    }
                </script>
</div>
</div>
<div class="mt-8 font-label-sm text-label-sm text-primary font-bold uppercase tracking-widest transition-all duration-300" id="age-display">
            Leo is 7 years old
        </div>
</main>
<!-- Bottom Action Area -->
<footer class="fixed bottom-0 left-0 w-full p-margin-mobile bg-gradient-to-t from-background via-background to-transparent">
<div class="max-w-lg mx-auto flex flex-col gap-4">
<button class="w-full h-14 bg-primary text-on-primary font-headline-sm text-headline-sm rounded-full shadow-lg hover:shadow-xl active:scale-95 transition-all duration-200 flex items-center justify-center gap-2">
                Continue
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
<button class="w-full h-12 text-on-surface-variant font-label-sm text-label-sm hover:bg-surface-container-low rounded-full transition-colors active:scale-95">
                I'll do this later
            </button>
</div>
</footer>
<!-- No BottomNavBar for this transactional screen as per hierarchy rules -->
<script>
        // Micro-interaction for age scrolling
        const ageScroll = document.getElementById('age-scroller');
        let isDown = false;
        let startX;
        let scrollLeft;

        ageScroll.addEventListener('mousedown', (e) => {
            isDown = true;
            ageScroll.classList.add('active');
            startX = e.pageX - ageScroll.offsetLeft;
            scrollLeft = ageScroll.scrollLeft;
        });
        ageScroll.addEventListener('mouseleave', () => {
            isDown = false;
        });
        ageScroll.addEventListener('mouseup', () => {
            isDown = false;
        });
        ageScroll.addEventListener('mousemove', (e) => {
            if(!isDown) return;
            e.preventDefault();
            const x = e.pageX - ageScroll.offsetLeft;
            const walk = (x - startX) * 2;
            ageScroll.scrollLeft = scrollLeft - walk;
        });
    </script>
</body></html>
