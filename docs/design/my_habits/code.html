<style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        .circular-progress {
            --size: 48px;
            --stroke-width: 4px;
            width: var(--size);
            height: var(--size);
            transform: rotate(-90deg);
        }
        .circular-progress circle {
            fill: none;
            stroke-width: var(--stroke-width);
            stroke-linecap: round;
        }
        .circular-progress .bg { stroke: #eeeeed; }
        .circular-progress .fg { stroke: #006c49; transition: stroke-dashoffset 0.3s ease; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background min-h-screen pb-24">
<!-- Top App Bar -->
<header class="sticky top-0 z-40 bg-background/95 backdrop-blur-md px-4 h-16 flex items-center justify-between">
<h1 class="font-headline-md text-headline-md text-primary font-bold">My Habits</h1>
<div class="flex gap-2">
<button class="p-2 hover:bg-surface-container rounded-full transition-colors active:scale-95">
<span class="material-symbols-outlined text-on-surface-variant">search</span>
</button>
<button class="p-2 hover:bg-surface-container rounded-full transition-colors active:scale-95">
<span class="material-symbols-outlined text-on-surface-variant">filter_list</span>
</button>
<button class="p-2 hover:bg-surface-container rounded-full transition-colors active:scale-95">
<span class="material-symbols-outlined text-on-surface-variant">add_circle</span>
</button>
</div>
</header>
<main class="px-5 space-y-6">
<!-- Segmented Control -->
<nav class="flex p-1 bg-surface-container-low rounded-2xl">
<button class="flex-1 py-2 px-4 rounded-xl text-label-sm font-label-sm bg-surface shadow-sm text-primary transition-all">Today</button>
<button class="flex-1 py-2 px-4 rounded-xl text-label-sm font-label-sm text-on-surface-variant hover:bg-surface-variant/20 transition-all">Active</button>
<button class="flex-1 py-2 px-4 rounded-xl text-label-sm font-label-sm text-on-surface-variant hover:bg-surface-variant/20 transition-all">Archived</button>
</nav>
<!-- Habit Cards List -->
<div class="space-y-4">
<!-- Card 1: Drink Water -->
<article class="bg-surface p-5 rounded-2xl shadow-sm border border-outline-variant/30 hover:shadow-md transition-shadow cursor-pointer active:scale-[0.98]">
<div class="flex justify-between items-start mb-4">
<div>
<span class="inline-block px-2 py-0.5 bg-primary-container text-on-primary-container text-[10px] font-bold rounded-md tracking-wider mb-2">HEALTH</span>
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-1">Drink Water</h2>
<p class="text-caption font-caption text-on-surface-variant">Daily • 5 / 8 Glasses</p>
</div>
<div class="relative circular-progress">
<svg viewbox="0 0 48 48">
<circle class="bg" cx="24" cy="24" r="20"></circle>
<circle class="fg" cx="24" cy="24" r="20" style="stroke-dasharray: 125.6; stroke-dashoffset: 47.1;"></circle>
</svg>
<div class="absolute inset-0 flex items-center justify-center">
<span class="text-[10px] font-bold text-primary">62%</span>
</div>
</div>
</div>
<div class="flex items-center gap-1 text-warning">
<span class="text-body-numbers font-body-numbers">🔥 18 Day Streak</span>
</div>
</article>
<!-- Card 2: Meditation -->
<article class="bg-surface p-5 rounded-2xl shadow-sm border border-outline-variant/30 hover:shadow-md transition-shadow cursor-pointer active:scale-[0.98]">
<div class="flex justify-between items-start mb-4">
<div>
<span class="inline-block px-2 py-0.5 bg-tertiary-container text-on-tertiary-container text-[10px] font-bold rounded-md tracking-wider mb-2">MINDFULNESS</span>

<p class="text-caption font-caption text-on-surface-variant">Daily • 15 / 20 Minutes</p>

<div class="relative circular-progress">
<svg viewbox="0 0 48 48">
<circle class="bg" cx="24" cy="24" r="20"></circle>
<circle class="fg" cx="24" cy="24" r="20" style="stroke-dasharray: 125.6; stroke-dashoffset: 31.4;"></circle>
</svg>
<div class="absolute inset-0 flex items-center justify-center">
<span class="text-[10px] font-bold text-primary">75%</span>
</div>
</div>
</div>
<div class="flex items-center gap-1 text-warning">

<span class="material-symbols-outlined">settings</span>
