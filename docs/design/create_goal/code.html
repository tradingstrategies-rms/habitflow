<script>
        // Category Selection Logic
        const categoryBtns = document.querySelectorAll('.category-btn');
        categoryBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                categoryBtns.forEach(b => {
                    b.classList.remove('active', 'border-primary', 'bg-primary/5');
                    b.classList.add('border-outline-variant/50');
                });
                btn.classList.add('active', 'border-primary', 'bg-primary/5');
                btn.classList.remove('border-outline-variant/50');
            });
        });

        // Timeframe Chip Logic
        const timeframeChips = document.querySelectorAll('.timeframe-chip');
        const timeframeLabel = document.getElementById('timeframeLabel');
        timeframeChips.forEach(chip => {
            chip.addEventListener('click', () => {
                timeframeChips.forEach(c => {
                    c.classList.remove('active', 'bg-primary', 'text-on-primary', 'border-primary');
                    c.classList.add('border-outline-variant', 'text-on-surface-variant');
                });
                chip.classList.add('active', 'bg-primary', 'text-on-primary', 'border-primary');
                chip.classList.remove('border-outline-variant', 'text-on-surface-variant');
                timeframeLabel.textContent = chip.getAttribute('data-value');
            });
        });

        // Visibility Toggle Logic
        const visibilityToggle = document.getElementById('visibilityToggle');
        const visibilityStatus = document.getElementById('visibilityStatus');
        visibilityToggle.addEventListener('change', (e) => {
            visibilityStatus.textContent = e.target.checked ? 'Shared with Family members' : 'Only visible to you';
        });

        // Handle Form Submission
        document.getElementById('createGoalForm').addEventListener('submit', (e) => {
            e.preventDefault();
            // Simple visual feedback
            const btn = e.target.querySelector('button[type="submit"]');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Creating...';
            btn.disabled = true;
            
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Goal Created!';
                btn.classList.replace('bg-primary', 'bg-success');
                setTimeout(() => {
                    btn.innerHTML = originalHtml;
                    btn.classList.replace('bg-success', 'bg-primary');
                    btn.disabled = false;
                }, 2000);
            }, 1500);
        });

        // Initialize first category
        categoryBtns[0].click();
    </script>
