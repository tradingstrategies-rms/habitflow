<style>
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
        }
        
        @keyframes tree-growth {
            0% { transform: scale(0.8) translateY(20px); opacity: 0; }
            60% { transform: scale(1.05) translateY(-5px); opacity: 1; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        @keyframes leaf-pop {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes confetti-fall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        .animate-tree { animation: tree-growth 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        .animate-leaf { animation: leaf-pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            z-index: 10;
        }

            background-image: radial-gradient(circle at 2px 2px, rgba(0, 108, 73, 0.05) 1px, transparent 0);

<script>
        // Confetti Generator
        const container = document.getElementById('confetti-container');
        const colors = ['#006c49', '#10b981', '#FFC107', '#4edea3', '#71f8e4'];
        
        function createConfetti() {
            for (let i = 0; i < 60; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = '-20px';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                
                const duration = 2 + Math.random() * 3;
                const delay = Math.random() * 2;
                
                confetti.style.animation = `confetti-fall ${duration}s ${delay}s linear forwards`;
                container.appendChild(confetti);
                
                // Remove from DOM after animation
                setTimeout(() => confetti.remove(), (duration + delay) * 1000);
            }
        }

        // Trigger confetti on load
        window.addEventListener('load', () => {
            setTimeout(createConfetti, 600);
            
            // Micro-interaction: button haptic feel
            const btn = document.querySelector('button');
            btn.addEventListener('mouseenter', () => {
                // Potential for light rumble or extra particles
            });
        });

        // Add tailwind fade-in-up animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fade-in-up {
                from { opacity: 0; transform: translateY(20px); }
                to { opacity: 1; transform: translateY(0); }
            }
        `;
        document.head.appendChild(style);
    </script>
