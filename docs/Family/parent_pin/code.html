<!-- Header Section -->

</div>

<div class="pin-dot w-4 h-4 rounded-full bg-surface-container-highest border border-outline-variant"></div>
<div class="pin-dot w-4 h-4 rounded-full bg-surface-container-highest border border-outline-variant"></div>

<!-- Adaptive Numeric Keypad -->
<div class="grid grid-cols-3 gap-y-4 gap-x-8 w-full">
<!-- Numbers 1-9 -->

</button>

<button class="keypad-button h-20 w-full flex flex-col items-center justify-center rounded-2xl hover:bg-surface-container-low transition-all duration-150 active:bg-primary-container/20 group" onclick="addDigit('3')">

            Use Face ID Instead
        </button>

<script>
        let currentPin = "";
        const maxPinLength = 4;
        const dots = document.querySelectorAll('.pin-dot');
        const pinContainer = document.getElementById('pin-container');

        function addDigit(digit) {
            if (currentPin.length < maxPinLength) {
                currentPin += digit;
                updateDots();
                
                // Haptic feedback simulation
                if (window.navigator.vibrate) {
                    window.navigator.vibrate(10);
                }

                if (currentPin.length === maxPinLength) {
                    validatePin();
                }
            }
        }

        function removeDigit() {
            if (currentPin.length > 0) {
                currentPin = currentPin.slice(0, -1);
                updateDots();
            }
        }

        function updateDots() {
            dots.forEach((dot, index) => {
                if (index < currentPin.length) {
                    dot.classList.add('active', 'bg-primary');
                    dot.classList.remove('bg-surface-container-highest');
                } else {
                    dot.classList.remove('active', 'bg-primary');
                    dot.classList.add('bg-surface-container-highest');
                }
            });
        }

        function validatePin() {
            // Simulated validation
            setTimeout(() => {
                const isSuccess = true; // In real app, check against saved PIN if verifying
                
                if (isSuccess) {
                    pinContainer.classList.add('success-animation');
                    // Success feedback
                    dots.forEach(dot => dot.style.backgroundColor = '#22C55E'); // success color
                    
                    // Proceed to next screen
                    setTimeout(() => {
                        console.log("PIN set successfully: " + currentPin);
                        // Redirect or show success modal
                    }, 500);
                } else {
                    // Error state
                    pinContainer.classList.add('shake');
                    dots.forEach(dot => dot.style.backgroundColor = '#EF4444'); // danger color
                    
                    setTimeout(() => {
                        currentPin = "";
                        updateDots();
                        pinContainer.classList.remove('shake');
                        dots.forEach(dot => dot.style.backgroundColor = '');
                    }, 500);
                }
            }, 300);
        }

        // Physical Keyboard Support
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') {
                addDigit(e.key);
            } else if (e.key === 'Backspace') {
                removeDigit();
            }
        });
    </script>
