</button>

<!-- Bottom Nav Bar (Hidden for this Task-Focused Screen as per instructions) -->
<!-- The shared component logic suppresses global nav on task-focused journeys like this wizard. -->
<script>
        function selectTree(element) {
            // Remove selection from all
            document.querySelectorAll('.tree-option').forEach(card => {
                card.classList.remove('tree-card-selected');
                card.classList.add('border-outline-variant');
            });

            // Add selection to clicked
            element.classList.add('tree-card-selected');
            element.classList.remove('border-outline-variant');

            // Enable Continue Button
            const continueBtn = document.getElementById('continue-btn');
            continueBtn.disabled = false;
            continueBtn.classList.remove('bg-outline-variant', 'cursor-not-allowed', 'opacity-50');
            continueBtn.classList.add('bg-primary-container', 'hover:bg-primary', 'active:scale-95');
            
            // Add slight celebration feedback
            element.style.transform = 'scale(0.98)';
            setTimeout(() => {
                element.style.transform = 'scale(1.02)';
            }, 100);
        }

        // Micro-interaction for the button
        document.getElementById('continue-btn').addEventListener('click', function() {
            if(!this.disabled) {
                this.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Planting...';
                setTimeout(() => {
                    alert('Tree selected! Heading to your family dashboard.');
                }, 1000);
            }
        });
    </script>
